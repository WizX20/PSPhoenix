name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on main always finish, so the release gate never
  # meets a 'cancelled' run for the commit it is about to ship.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PowerShell 7.4+ only (the manifest says so): no Windows PowerShell 5.1 leg, unlike
        # PSWorktree. Linux covers WSL and the later launchd/systemd scheduling. Keep these
        # names as they are once they are required checks in the main ruleset.
        include:
          - { name: pwsh, os: windows-latest }
          - { name: pwsh-linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: ./scripts/lint.ps1

      - name: Test (Pester)
        shell: pwsh
        run: ./scripts/test.ps1 -CI

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: dist/test-results.xml

  pack:
    name: pack module zip
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pack
        shell: pwsh
        run: ./scripts/pack.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: dist/PSPhoenix-*.zip

  token-expiry:
    name: release token expiry
    runs-on: ubuntu-latest
    # Pull requests from forks carry no secrets: nothing to check there, and the job must not
    # block them. Everything else (own branches, pushes to main) gets the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SECRET_NAME: PSPHOENIX_RELEASE_TOKEN
      WARN_DAYS: 30
      FAIL_DAYS: 14
    steps:
      - name: Read the token's expiry from the API
        env:
          TOKEN: ${{ secrets.PSPHOENIX_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The release commit is pushed with this fine-grained PAT (main is PR-only; GITHUB_TOKEN
          # cannot bypass the ruleset). A lapsed token breaks every release, so the token's own
          # expiry - GitHub sends it back on any call made with it - gates merges: a warning from
          # WARN_DAYS out, a failure from FAIL_DAYS out. Rotation: DEVGUIDE.md -> Release process.
          if [ -z "$TOKEN" ]; then
            # Before the first release the secret may not exist yet: warn instead of failing, so
            # the repository can get going. The release workflow itself still refuses to run.
            echo "::warning::Repository secret $SECRET_NAME is not set yet - releases cannot push to main until it is (DEVGUIDE.md -> Release process)."
            exit 0
          fi
          HEADERS=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/user)
          STATUS=$(printf '%s\n' "$HEADERS" | head -1 | tr -d '\r')
          case "$STATUS" in
            *" 200"*) ;;
            *) echo "::error::$SECRET_NAME was rejected by the API ($STATUS) - expired or revoked? Rotate it (DEVGUIDE.md -> Release process)."; exit 1 ;;
          esac
          EXPIRES=$(printf '%s\n' "$HEADERS" | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$EXPIRES" ]; then
            echo "::error::$SECRET_NAME has no expiration header - is it a fine-grained token with an expiry?"
            exit 1
          fi
          DAYS=$(( ( $(date -u -d "$EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "$SECRET_NAME expires on $EXPIRES - $DAYS day(s) left"
          echo "### Release token" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SECRET_NAME\` expires on **$EXPIRES** ($DAYS days left)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DAYS" -le "$FAIL_DAYS" ]; then
            echo "::error::$SECRET_NAME expires in $DAYS day(s) ($EXPIRES). Rotate it before merging anything else."
            exit 1
          fi
          if [ "$DAYS" -le "$WARN_DAYS" ]; then
            echo "::warning::$SECRET_NAME expires in $DAYS day(s) ($EXPIRES). Rotate it soon."
          fi
